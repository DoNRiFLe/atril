name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# una publicacion a la vez, sin cancelar la que ya esta en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6
        with:
          # activa Pages en el repo si todavia no lo estaba
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          # no hay build: se publica el repo tal cual (sin los archivos que empiezan con punto)
          path: '.'

      - id: deploy
        uses: actions/deploy-pages@v5
